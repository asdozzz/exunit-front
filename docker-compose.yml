version: "3.9"
services:
  app:
    build:
      context: .
      cache_from:
        - type=registry,ref=http://unitman_registry/exunit-front/app:latest
      cache_to:
        - type=registry,ref=http://unitman_registry/exunit-front/app:latest,mod=max
    env_file: ".env.local"
    ports:
      - 8089:5173
    volumes:
      - ./:/app
