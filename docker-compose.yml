version: "3.9"
services:
  app:
    build:
      context: .
      cache_from:
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-front/app:${UNITMAN_BRANCH_NAME}
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-front/app:latest
      cache_to:
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-front/app:${UNITMAN_BRANCH_NAME},mode=max
        - type=registry,ref=${UNITMAN_CACHE_REPO}/exunit-front/app:latest,mode=max
    env_file: ".env.local"
    stdin_open: true             # Позволяет корректно обрабатывать сигналы завершения
    tty: true
    environment:
      - NODE_ENV=development
      - VITE_USER_NODE_ENV=development
    ports:
      - 8089:5173
    command: sh -c "tail -f /dev/null"
